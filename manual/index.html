<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE STUDIO Manual</title>
<style>
:root{--bg:#0b0b0b;--panel:#111;--card:#181818;--line:#2a2a2a;--text:#dedede;--dim:#888;--brand:#7612da;--brand2:#b57bff;--code:#222}
:root[data-theme="light"]{--bg:#f6f6f8;--panel:#fff;--card:#fff;--line:#ddd;--text:#1b1b1b;--dim:#666;--brand:#7612da;--brand2:#6a1fc2;--code:#eee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;color:var(--brand2);white-space:nowrap}
header .sp{flex:1}
#q{flex:0 1 260px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button.tg{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:700}
button.tg:hover{border-color:var(--brand)}
button.tg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.wrap{display:flex;max-width:1280px;margin:0 auto}
nav{width:270px;flex:none;padding:14px 10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;border-right:1px solid var(--line)}
nav h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
nav a{display:block;padding:5px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover{background:var(--card)}
nav a.cur{background:var(--brand);color:#fff}
main{flex:1;min-width:0;padding:22px 28px 80px}
main h2{margin:0 0 4px;font-size:26px}
main .lead{color:var(--dim);margin:0 0 22px}
section{margin:0 0 26px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
section h3{margin:0 0 8px;font-size:17px;color:var(--brand2)}
.body{white-space:pre-wrap;word-break:break-word}
.body code,code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:.92em}
figure{margin:12px 0 0}
figure img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
figcaption{font-size:12.5px;color:var(--dim);margin-top:5px}
table{border-collapse:collapse;width:100%;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;font-size:14px}
th{background:var(--card)}
td:first-child,th:first-child{min-width:9em}
table.c2 td:first-child,table.c2 th:first-child{width:24%}
table.c3 td:first-child,table.c3 th:first-child{width:20%}
mark{background:#7612da66;color:inherit;border-radius:3px}
.missing{color:#ffb347;font-size:12.5px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pn a{color:var(--brand2);text-decoration:none;font-weight:700}
@media(max-width:820px){nav{display:none}main{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>ONE STUDIO Manual</h1>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="Search / 검색">
  <button class="tg" id="bKo">한국어</button>
  <button class="tg" id="bEn">English</button>
  <button class="tg" id="bTh" title="Light / Dark">◐</button>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script src="manifest.js"></script>
<script src="manual.js"></script>
</body>
</html>
